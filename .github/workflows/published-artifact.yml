name: Published Artifact Service

on:
  pull_request:
    paths:
      - "apps/published-artifact/Dockerfile"
      - "apps/published-artifact/cmd/artifact-server/**"
      - "apps/published-artifact/internal/archive/**"
      - "apps/published-artifact/internal/httpapi/**"
      - "apps/published-artifact/internal/names/**"
      - "apps/published-artifact/internal/store/**"
      - "apps/published-artifact/internal/telemetry/**"
      - "apps/published-artifact/go.mod"
      - "apps/published-artifact/go.sum"
      - "apps/published-artifact/sqlc.yaml"
      - ".github/workflows/published-artifact.yml"
  push:
    branches: [main]
    paths:
      - "apps/published-artifact/Dockerfile"
      - "apps/published-artifact/cmd/artifact-server/**"
      - "apps/published-artifact/internal/archive/**"
      - "apps/published-artifact/internal/httpapi/**"
      - "apps/published-artifact/internal/names/**"
      - "apps/published-artifact/internal/store/**"
      - "apps/published-artifact/internal/telemetry/**"
      - "apps/published-artifact/go.mod"
      - "apps/published-artifact/go.sum"
      - "apps/published-artifact/sqlc.yaml"
      - ".github/workflows/published-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-artifact-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/eli0shin/artifacts

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/published-artifact/go.mod
          cache-dependency-path: apps/published-artifact/go.sum

      - name: Verify generated catalog code
        working-directory: apps/published-artifact
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          git diff --exit-code -- internal/store/catalogdb

      - name: Build server
        working-directory: apps/published-artifact
        run: go build ./cmd/artifact-server

      - name: Test service
        working-directory: apps/published-artifact
        run: go test ./cmd/artifact-server ./internal/archive ./internal/httpapi ./internal/names ./internal/store ./internal/store/catalogdb ./internal/telemetry

      - name: Build container
        run: docker build --pull --tag published-artifact:verify apps/published-artifact

  publish:
    needs: verify
    permissions:
      contents: write
      packages: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare server version
        run: |
          set -euo pipefail
          current=$(<apps/published-artifact/SERVER_VERSION)
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS=. read -r major minor patch <<< "$current"
          version="$major.$minor.$((patch + 1))"
          printf '%s\n' "$version" > apps/published-artifact/SERVER_VERSION
          printf 'SERVER_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/published-artifact/SERVER_VERSION
          git commit -m "chore: release artifact server v${version}"
          git tag "v${version}"

      - name: Build publication image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --tag "$IMAGE_NAME:v${SERVER_VERSION}" \
            apps/published-artifact

      - name: Publish image
        run: docker push "$IMAGE_NAME:v${SERVER_VERSION}"

      - name: Publish server version
        run: git push --atomic origin HEAD:main "v${SERVER_VERSION}"
