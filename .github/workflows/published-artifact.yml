name: Published Artifact Service

on:
  pull_request:
    paths:
      - "apps/published-artifact/Dockerfile"
      - "apps/published-artifact/cmd/artifact-server/**"
      - "apps/published-artifact/internal/archive/**"
      - "apps/published-artifact/internal/httpapi/**"
      - "apps/published-artifact/internal/names/**"
      - "apps/published-artifact/internal/store/**"
      - "apps/published-artifact/internal/telemetry/**"
      - "apps/published-artifact/go.mod"
      - "apps/published-artifact/go.sum"
      - "apps/published-artifact/sqlc.yaml"
      - ".github/workflows/published-artifact.yml"
  push:
    branches: [main]
    paths:
      - "apps/published-artifact/Dockerfile"
      - "apps/published-artifact/cmd/artifact-server/**"
      - "apps/published-artifact/internal/archive/**"
      - "apps/published-artifact/internal/httpapi/**"
      - "apps/published-artifact/internal/names/**"
      - "apps/published-artifact/internal/store/**"
      - "apps/published-artifact/internal/telemetry/**"
      - "apps/published-artifact/go.mod"
      - "apps/published-artifact/go.sum"
      - "apps/published-artifact/sqlc.yaml"
      - ".github/workflows/published-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-artifact-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: registry.home.arpa/published-artifact

jobs:
  verify:
    runs-on: homelab-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/published-artifact/go.mod
          cache-dependency-path: apps/published-artifact/go.sum

      - name: Verify generated catalog code
        working-directory: apps/published-artifact
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          git diff --exit-code -- internal/store/catalogdb

      - name: Build server
        working-directory: apps/published-artifact
        run: go build ./cmd/artifact-server

      - name: Test service
        working-directory: apps/published-artifact
        run: go test ./cmd/artifact-server ./internal/archive ./internal/httpapi ./internal/names ./internal/store ./internal/store/catalogdb ./internal/telemetry

      - name: Build container
        run: docker build --pull --tag published-artifact:verify apps/published-artifact

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: homelab-linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to homelab registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.home.arpa
          username: ${{ secrets.HOMELAB_REGISTRY_USERNAME }}
          password: ${{ secrets.HOMELAB_REGISTRY_PASSWORD }}

      - name: Build publication image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_NAME:sha-${GITHUB_SHA}" \
            apps/published-artifact

      - name: Publish image
        run: docker push "$IMAGE_NAME:sha-${GITHUB_SHA}"
